spring.application.name=pokedex-api

# Porta da API. No Render ela vem da variável PORT; no PC é a 8080.
server.port=${PORT:8080}

# Banco H2 em memória: as tabelas são criadas e o data.sql é carregado toda vez que a API sobe
spring.datasource.url=jdbc:h2:mem:pokedexdb
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.open-in-view=false

# Swagger em /swagger-ui/index.html
springdoc.default-produces-media-type=application/json
